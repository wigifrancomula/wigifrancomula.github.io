<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEP NEF Quiz: Articles, Prepositions &amp; Collocations</title>
<style>
:root{--bg:#f6f7fb;--fg:#1c2033;--mut:#5f6580;--card:#fff;--bd:#d9dcea;--ac:#1f3a8a;--acfg:#fff;--ok:#146c43;--okbg:#e2f5ea;--bad:#b42318;--badbg:#fde8e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--fg:#e8eaf3;--mut:#9aa0ba;--card:#1b1e2a;--bd:#33374a;--ac:#8fa8ff;--acfg:#10162e;--ok:#6fdc9c;--okbg:#153524;--bad:#ff8d82;--badbg:#3d1a17}}
:root[data-theme="dark"]{--bg:#12141c;--fg:#e8eaf3;--mut:#9aa0ba;--card:#1b1e2a;--bd:#33374a;--ac:#8fa8ff;--acfg:#10162e;--ok:#6fdc9c;--okbg:#153524;--bad:#ff8d82;--badbg:#3d1a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
header{background:var(--ac);color:var(--acfg);border-radius:14px;padding:18px 20px;margin-bottom:14px}
header h1{margin:0;font-size:1.35rem}
header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
.info{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:14px}
.info label{font-size:.75rem;color:var(--mut);display:block}
.info input{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;margin-bottom:14px}
h2{font-size:1.3rem;margin:0 0 2px;color:var(--ac)}
.ins{margin:0 0 8px;color:var(--mut);font-size:1.05rem}
ol{margin:0;padding-left:28px;font-size:1.4rem}
li{margin:14px 0;padding-left:2px;line-height:1.7}
select,input.t{font:inherit;font-size:1.3rem;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);margin:0 4px}
input.t{width:8.5em}
select:disabled,input:disabled{opacity:1;color:var(--fg)}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important}
.fb{color:var(--bad);font-weight:600;font-size:.88rem;margin-left:3px}
.ps{margin-top:8px;font-weight:600;font-size:.92rem;color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;align-items:center}
.bar span{color:var(--mut);font-size:.9rem}
button{font:inherit;font-weight:600;padding:9px 18px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--acfg);cursor:pointer}
button.g{background:transparent;color:var(--ac)}
#res{display:none;text-align:center;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:16px;margin-bottom:14px}
#res .pct{font-size:2.4rem;font-weight:800;color:var(--ac)}
@media(max-width:520px){.info{grid-template-columns:1fr 1fr}.info div:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<header><h1>NEF Quiz: Articles, Prepositions &amp; Collocations</h1><p>Western International School · General English Program · 100-point quiz</p></header>
<div class="info">
<div><label for="nm">Name</label><input id="nm" autocomplete="name"></div>
<div><label for="lv">Level</label><input id="lv"></div>
<div><label for="dt">Date</label><input id="dt" type="date"></div>
</div>
<div id="res"></div>
<div id="q"></div>
</main>
<div class="bar"><span id="prog">0 / 79 answered</span><button id="chk">Check my answers</button><button id="rst" class="g">Start over</button></div>
<script>
const A=["a","an","the","Ø"];
const S=[
{t:"A. Articles",i:"Choose the correct article: a, an, the, or Ø (no article).",o:A,q:[
["It is not difficult to play __ guitar.","the"],
["__ wolves are very dangerous animals.","Ø"],
["Who invented __ light bulb?","the"],
["Have you ever eaten __ Indian food?","Ø"],
["__ computers are really useful tools.","Ø"],
["__ police responded quickly to the call.","the"],
["The fastest animal in the world is __ cheetah.","the"],
["__ Nile River is the longest river in Africa.","the"],
["There is __ mug on the counter over there.","a"],
["__ movie that I saw last night was very good.","the"],
["I really hate __ scary movies.","Ø"],
["__ annual conference will be held at Aria in Las Vegas.","the|an"],
["__ Louvre is the most famous museum in France.","the"],
["The Taj Mahal is located in __ India.","Ø"],
["__ Mississippi River is very long.","the"],
["__ lakes are usually cleaner than __ rivers.",["Ø","Ø"]],
["__ northern part of China is very cold.","the"],
["She gave me __ advice.","Ø"],
["I ate __ apple for lunch.","an"],
["He was born in __ taxicab.","a"],
["I ate __ breakfast at 7:00.","Ø"],
["Chile is located in __ South America.","Ø"],
["My sister had __ X-ray of her arm taken.","an"],
["There is a painting on __ wall in the living room.","the"],
["I have never eaten __ bread from Afghanistan.","Ø"]]},
{t:"B. a or an",i:"Pay close attention to the sound at the beginning of the word. Choose a or an.",o:["a","an"],q:[
["Senator Jackson is __ honest woman.","an"],
["The teachers at Trinity College belong to __ union.","a"],
["The manager found __ hair in her soup.","a"],
["That is __ ugly bag. I can't believe you paid $200 for it.","an"],
["Mildred's son attends __ university in Houston, Texas.","a"],
["Can you give me __ hand. I can't do this by myself.","a"],
["George was driving very fast, more than 95 miles __ hour.","an"],
["Basil is __ herb. It has a wonderful flavor.","an|a"],
["Chemistry is __ hard course.","a"],
["It is very difficult to get __ A in physics.","an"]]},
{t:"C. the or Ø",i:"Complete the sentences by choosing the or Ø (no article) before the nouns.",o:["the","Ø"],q:[
["__ Lake Titicaca is located on the border between Peru and Bolivia.","Ø"],
["There are three states located on __ Pacific Ocean: California, Oregon, and Washington.","the"],
["__ Sahara desert is located in northern Africa.","the"],
["__ Rocky Mountains pass through Idaho, Wyoming, and Colorado.","the"],
["__ Nile is the longest river in the world.","the"],
["Many people in Chicago take boat rides on __ Lake Michigan.","Ø"],
["China has one of the largest deserts in the world: __ Gobi desert.","the"],
["Now that it has been cleaned up, people go swimming in __ Hudson River.","the"],
["__ Indian Ocean is the third largest ocean in the world.","the"],
["The 2006 Winter Olympics were held in __ Alps in northern Italy.","the"],
["__ Greenland is the largest island in the world. It is seldom green.","Ø"],
["__ Mojave desert is located in California, Nevada, and Utah.","the"],
["Sochi, on __ Black Sea in Russia, hosted the 2014 Winter Olympics.","the"],
["__ St. Lawrence River flows through Ontario and Quebec in Canada.","the"],
["__ Mount Everest is the tallest mountain in the Himalayas.","Ø"]]},
{t:"D. Choose the correct preposition",i:"Pick the correct option from the list.",q:[
["She is very proud __ her son.","of",["of","for","with"]],
["I'm interested __ learning Italian.","in",["in","at","about"]],
["He was accused __ cheating.","of",["of","for","with"]],
["We were amazed __ the result.","at",["at","in","for"]],
["Are you satisfied __ your job?","with",["with","about","of"]],
["She is afraid __ spiders.","of",["of","from","about"]],
["He is good __ maths.","at",["at","in","to"]],
["I'm tired __ waiting.","of",["of","from","with"]],
["They were disappointed __ the hotel service.","with",["with","in","at"]],
["This town is famous __ its castle.","for",["for","of","with"]]]},
{t:"E. Complete with the correct preposition",i:"Type one preposition in each gap.",q:[
["He is very good __ solving problems.","at"],
["She was shocked __ the news.","at|by"],
["Are you familiar __ this software?","with"],
["I'm fed up __ this noise.","with"],
["He is allergic __ nuts.","to"],
["They are proud __ their achievements.","of"],
["This area is free __ pollution.","from"],
["She is married __ a doctor.","to"],
["He was angry __ the decision.","about|at"],
["We are grateful __ your help.","for"]]},
{t:"F. Find and correct the mistake",i:"Each sentence has one wrong preposition. Type the correct preposition.",q:[
["She is interested about history. Correct preposition: __","in"],
["He is very good in maths. Correct preposition: __","at"],
["I'm tired from listening to this. Correct preposition: __","of"],
["They were proud for their son. Correct preposition: __","of"],
["She is afraid from dogs. Correct preposition: __","of"],
["We were disappointed in the hotel. Correct preposition: __","with"],
["This book is famous of its characters. Correct preposition: __","for"],
["He is married with a French woman. Correct preposition: __","to"]]},
{t:"G. Collocations: Verbs + Preposition",i:"Type one preposition in each gap.",q:[
["She apologized __ being late.","for"],
["He always relies __ his brother for advice.","on"],
["This soup consists __ five different vegetables.","of"],
["They congratulated her __ passing the exam.","on"],
["We are looking forward __ the holidays.","to"],
["I don't want to argue __ you about this.","with"],
["The company plans to invest __ new technology.","in"],
["He finally succeeded __ finding a job.","in"],
["Please don't complain __ the weather.","about"],
["The results depend __ how hard you study.","on"],
["She applied __ a scholarship last month.","for"]]},
{t:"H. Collocations: Adjectives + Preposition",i:"Choose the correct preposition.",q:[
["He is capable __ solving the problem alone.","of",["of","for","with"]],
["I'm not really keen __ horror films.","on",["on","at","in"]],
["This vaccine makes you immune __ the disease.","to",["to","of","from"]],
["She felt guilty __ forgetting his birthday.","about",["of","about","for"]],
["The twins are very similar __ each other.","to",["to","with","of"]],
["He seems nervous __ the interview tomorrow.","about",["about","of","at"]],
["Our plans are dependent __ the weather.","on",["on","of","to"]],
["He is addicted __ his phone.","to",["to","with","of"]],
["She was suspicious __ the stranger's story.","of",["of","about","with"]],
["I'm curious __ what happened next.","about",["about","for","of"]]]}
];
const root=document.getElementById('q'),B=[];
S.forEach((s,si)=>{
 const sec=document.createElement('section');
 sec.innerHTML='<h2></h2><p class="ins"></p><ol></ol><div class="ps"></div>';
 sec.children[0].textContent=s.t;sec.children[1].textContent=s.i;
 const ol=sec.children[2];
 s.q.forEach(q=>{
  const li=document.createElement('li'),ans=[].concat(q[1]),parts=q[0].split('__'),opts=q[2]||s.o;
  parts.forEach((p,k)=>{
   li.append(p);
   if(k<parts.length-1){
    let el;
    if(opts){el=document.createElement('select');el.add(new Option('—',''));opts.forEach(o=>el.add(new Option(o,o)));}
    else{el=document.createElement('input');el.type='text';el.className='t';el.autocomplete='off';el.autocapitalize='none';el.spellcheck=false;}
    el.addEventListener('input',prog);
    const fb=document.createElement('span');fb.className='fb';
    li.append(el,fb);
    B.push({el,fb,a:ans[k],si});
   }
  });
  ol.append(li);
 });
 root.append(sec);
});
const $=id=>document.getElementById(id);
const norm=v=>v.trim().toLowerCase();
function prog(){$('prog').textContent=B.filter(b=>b.el.value.trim()).length+' / '+B.length+' answered';}
$('chk').onclick=()=>{
 const per=S.map(()=>0);let tot=0;
 B.forEach(b=>{
  const alts=b.a.split('|'),ok=alts.map(norm).includes(norm(b.el.value));
  b.el.classList.toggle('ok',ok);b.el.classList.toggle('bad',!ok);b.el.disabled=true;
  b.fb.textContent=ok?'':'→ '+alts[0]+(alts.length>1?' (also '+alts.slice(1).join(', ')+')':'');
  if(ok){tot++;per[b.si]++;}
 });
 document.querySelectorAll('.ps').forEach((d,i)=>d.textContent='Section score: '+per[i]+' / '+B.filter(b=>b.si===i).length);
 const pct=Math.round(tot/B.length*100),n=$('nm').value.trim();
 const r=$('res');r.style.display='block';
 r.innerHTML='<div>'+(n?n+', your':'Your')+' score</div><div class="pct">'+pct+'%</div><div>'+tot+' out of '+B.length+' correct</div><p style="margin:6px 0 0;color:var(--mut);font-size:.9rem">Wrong answers are shown in red with the correct answer next to them.</p>';
 $('chk').disabled=true;
 r.scrollIntoView({behavior:'smooth',block:'start'});
};
$('rst').onclick=()=>{
 B.forEach(b=>{b.el.value='';b.el.disabled=false;b.el.classList.remove('ok','bad');b.fb.textContent='';});
 document.querySelectorAll('.ps').forEach(d=>d.textContent='');
 $('res').style.display='none';$('chk').disabled=false;prog();
 window.scrollTo({top:0,behavior:'smooth'});
};
prog();
</script>
</body>
</html>
